name: Build Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Verify aPath.vbs exists
        run: |
          if (!(Test-Path "aPath.vbs")) {
            Write-Error "aPath.vbs file not found!"
            exit 1
          }
          Write-Host "aPath.vbs found - OK"
      
      - name: Install NSIS
        run: |
          choco install nsis -y
          
      - name: Build installer
        run: |
          makensis installer.nsi
          
      - name: Verify installer was created
        run: |
          if (!(Test-Path "aPath-Installer.exe")) {
            Write-Error "Installer was not created!"
            exit 1
          }
          Write-Host "Installer created successfully"
          Get-Item "aPath-Installer.exe" | Select-Object Name, Length, LastWriteTime
          
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: aPath-Installer
          path: aPath-Installer.exe
          
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: aPath-Installer.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
